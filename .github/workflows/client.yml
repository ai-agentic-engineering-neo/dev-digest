# Client suite — Next.js web app (@devdigest/web).
# Typecheck + component/unit tests (vitest + jsdom). Hermetic: no API, no DB,
# no browser — fetch is mocked in the tests. The full-stack browser flow lives
# in e2e-web.yml.
name: client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  # NOTE: deliberately no `paths:` filter here. This job is a REQUIRED status
  # check on main (Settings -> Branches). A required check that does not run
  # never reports, and GitHub leaves the PR stuck on "Expected - waiting for
  # status" with the merge button disabled forever. Path-filtering it would
  # deadlock every PR that touches only docs/ or .claude/.
  # The `push:` trigger above keeps its filter — no required check there.
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
