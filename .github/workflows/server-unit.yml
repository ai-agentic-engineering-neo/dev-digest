# Server unit suite — Fastify API (@devdigest/api), hermetic tests only.
#
# Three jobs:
#  - architecture: Onion layer check (dependency-cruiser + version-proof baseline), see the job below.
#  - typecheck: type-check on Linux only — the platform CI and the exported
#    agent-runner both run on. We deliberately do NOT matrix over Windows/macOS:
#    macOS is covered by daily local dev, Windows is not a ship target, and
#    `@ast-grep/napi` is exact-pinned so its native binary only changes on a
#    deliberate version bump.
#  - unit: the ~19 DB-free test files (everything that is NOT `*.it.test.ts`).
#    LLM/git/embeddings are mocked via src/adapters/mocks.ts — no Docker.
#
# DB-backed tests run in server-integration.yml. reviewer-core/** is in the
# path filter because server aliases ../reviewer-core/src at type-check time.
name: server unit

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'

permissions:
  contents: read

concurrency:
  group: server-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server type-checks reviewer-core's RAW source: tsconfig aliases
      # @devdigest/reviewer-core → ../reviewer-core/src, and platform/structured.ts
      # re-exports from it. That source imports `openai`/`zod`, so without
      # reviewer-core's deps installed, tsc fails with TS2307 → cascading
      # unknown→T errors. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm typecheck

  # Onion Architecture layer check (.claude/skills/onion-architecture). dependency-cruiser rules live in
  # server/.dependency-cruiser.cjs; legacy violations are frozen in server/architecture-baseline.json.
  # Fails on NEW error-level violations, and (on PRs) if the baseline grew vs the base branch — the
  # baseline may only shrink. reviewer-core deps are not needed: the check doesn't descend into it.
  architecture:
    name: layer check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Fetch base-branch baseline (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:server/architecture-baseline.json" > "$RUNNER_TEMP/base-baseline.json" \
            || echo "::notice::base branch has no architecture-baseline.json yet — growth check skipped"

      # Proves every rule actually fires (probe files) — a dead rule would otherwise pass silently.
      - name: Self-test layer rules
        run: node scripts/check-architecture.mjs --self-test

      - name: Check layers
        run: |
          if [ -s "$RUNNER_TEMP/base-baseline.json" ]; then
            node scripts/check-architecture.mjs --base "$RUNNER_TEMP/base-baseline.json"
          else
            node scripts/check-architecture.mjs
          fi

  unit:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The unit tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # Inlined rather than `pnpm test:unit`: server/package.json is
      # skip-worktree (a local variant), so the committed package.json may
      # not carry the split scripts. Run vitest directly.
      - run: pnpm exec vitest run --exclude '**/*.it.test.ts'
