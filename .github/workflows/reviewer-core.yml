# reviewer-core suite — the pure review engine (@devdigest/reviewer-core).
# diff → prompt → LLM → grounded findings, with no DB / GitHub / filesystem.
# Tests are hermetic units (the LLM is stubbed). Uses npm (package-lock.json).
#
# server/src/vendor/shared/** is in the path filter because reviewer-core
# aliases @devdigest/shared to it at type-check time.
name: reviewer-core

on:
  push:
    branches: [main]
    paths:
      - 'reviewer-core/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/reviewer-core.yml'
  # NOTE: deliberately no `paths:` filter here. This job is a REQUIRED status
  # check on main (Settings -> Branches). A required check that does not run
  # never reports, and GitHub leaves the PR stuck on "Expected - waiting for
  # status" with the merge button disabled forever. Path-filtering it would
  # deadlock every PR that touches only docs/ or .claude/.
  # The `push:` trigger above keeps its filter — no required check there.
  pull_request:

permissions:
  contents: read

concurrency:
  group: reviewer-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: reviewer-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reviewer-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reviewer-core/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
