# Server integration suite — the DB-backed test files (`*.it.test.ts`).
#
# Each spins up a real Postgres (pgvector) via testcontainers, builds the
# Fastify app, migrates + seeds, and exercises the routes end-to-end against
# the DB. Docker is present on ubuntu-latest, so testcontainers can pull the
# image; the tests also self-skip (`dockerAvailable()`) if Docker is somehow
# absent, so this job degrades to a no-op rather than a hard failure.
#
# Linux only — testcontainers needs a Linux Docker daemon (Windows runners
# don't provide one).
name: server integration

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/src/**'
      - '.nvmrc'
      - '.github/workflows/server-integration.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/src/**'
      - '.nvmrc'
      - '.github/workflows/server-integration.yml'

permissions:
  contents: read

concurrency:
  group: server-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Integration tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # `.it.test` selects exactly the DB-backed files. vitest's config gives
      # them a 120s timeout for container spin-up; no API keys needed — LLM/git
      # are mocked.
      - run: pnpm test:integration
