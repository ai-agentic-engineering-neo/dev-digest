# Server unit suite — Fastify API (@devdigest/api), hermetic tests only.
#
# Two jobs:
#  - static: typecheck + Biome lint + onion-architecture check (dependency-cruiser
#    over src/ and ../reviewer-core/src). Linux only: macOS is covered by daily
#    local dev, Windows is not a ship target, and `@ast-grep/napi` is
#    exact-pinned so its native binary only changes on a deliberate version bump.
#  - unit: the DB-free test files (everything that is NOT `*.it.test.ts`).
#    LLM/git/embeddings are mocked via src/adapters/mocks.ts — no Docker.
#
# DB-backed tests run in server-integration.yml. reviewer-core/** is in the
# path filter because server type-checks, lints the layering of, and imports
# ../reviewer-core/src.
name: server unit

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - 'biome.jsonc'
      - '.nvmrc'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - 'biome.jsonc'
      - '.nvmrc'
      - '.github/workflows/server-unit.yml'

permissions:
  contents: read

concurrency:
  group: server-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + lint + architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server type-checks reviewer-core's RAW source: tsconfig aliases
      # @devdigest/reviewer-core → ../reviewer-core/src, and platform/structured.ts
      # re-exports from it. That source imports `openai`/`zod`, so without
      # reviewer-core's deps installed, tsc fails with TS2307 → cascading
      # unknown→T errors. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm typecheck

      - run: pnpm lint

      # Onion-architecture rules (.dependency-cruiser.cjs) via `pnpm arch:check`
      # = depcruise src ../reviewer-core/src --config .dependency-cruiser.cjs --ignore-known.
      # The known-violations baseline is empty, so --ignore-known is a no-op
      # today; it stays so a deliberate baseline keeps working (it may only shrink).
      - name: Architecture (dependency-cruiser)
        run: pnpm arch:check

  unit:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The unit tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm test:unit
