allowBuilds:
  esbuild: true

# pnpm 11+ ignores the "pnpm" field in package.json — overrides live here.
overrides:
  postcss: ^8.5.23
  katex: ^0.18.2

# Install native binaries for this machine (current) plus Windows and Linux — node_modules
# is shared between both OSes on a dual-boot NTFS drive. `current` keeps other platforms (e.g. macOS) working.
supportedArchitectures:
  os: [current, win32, linux]
  cpu: [current, x64]
  libc: [current, glibc]
