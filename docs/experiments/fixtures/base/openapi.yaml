openapi: 3.0.3
info:
  title: Orders API
  version: 1.3.0
paths:
  /v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Fetch a single order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
components:
  schemas:
    Order:
      type: object
      required: [id, total, currency]
      properties:
        id:
          type: string
        total:
          type: number
          description: Order total in minor units (cents)
        currency:
          type: string
